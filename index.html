<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hugo · Accueil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Crect x=%272%27 y=%272%27 width=%2716%27 height=%2716%27 rx=%274%27 fill=%27%2313201A%27/%3E%3C/svg%3E">
<style>
:root{
  --fond:#F4F2EC; --carte:#FFFFFF; --encre:#1A1A18; --sourdine:#64625B; --filet:#D9D5CA;
  --rose:#DB2659; --rose-pale:#FFDDE6; --jaune:#F5C400; --vert-pale:#E6EBE8;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --fond:#141412; --carte:#1F1F1C; --encre:#EEEDE8; --sourdine:#A4A29A; --filet:#34332E;
    --rose:#FF6B90; --rose-pale:#40172F; --jaune:#F5C400; --vert-pale:#1A2420;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; display:flex; background:var(--fond); color:var(--encre);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
main{width:100%;max-width:760px;margin:auto;padding:40px 20px;display:flex;flex-direction:column;gap:28px}
h1{margin:0;font-size:clamp(28px,6vw,40px);line-height:1.05;letter-spacing:-.01em}
.chapo{margin:6px 0 0;color:var(--sourdine)}
.choix{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
a.service{
  display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:14px;
  background:var(--carte);border:1.5px solid var(--filet);color:inherit;text-decoration:none;
  transition:transform .15s,border-color .15s,box-shadow .15s;
}
a.service:hover,a.service:focus-visible{border-color:var(--encre);transform:translateY(-2px);box-shadow:0 6px 0 var(--filet);outline:none}
.pastille{width:56px;height:56px;border-radius:12px;display:grid;place-items:center}
.date .pastille{background:var(--rose-pale);color:var(--rose)}
.portions .pastille{background:var(--vert-pale)}
.service h2{margin:0;font-size:22px}
.service p{margin:0;color:var(--sourdine);font-size:15px}
.aller{margin-top:auto;font-weight:600;font-size:15px}
.date .aller{color:var(--rose)}
@media (prefers-reduced-motion:reduce){a.service{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Bonjour 👋</h1>
    <p class="chapo">Choisis le service que tu veux ouvrir.</p>
  </header>

  <nav class="choix" aria-label="Services">
    <a class="service date" href="date/">
      <span class="pastille" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 20 20"><path d="M10 17.5S2 12.6 2 7.2A4.2 4.2 0 0 1 10 5a4.2 4.2 0 0 1 8 2.2c0 5.4-8 10.3-8 10.3z" fill="currentColor"/></svg>
      </span>
      <h2>Billet pour deux</h2>
      <p>Le petit site pour proposer un date.</p>
      <span class="aller">Ouvrir →</span>
    </a>

    <a class="service portions" href="portions/">
      <span class="pastille" aria-hidden="true">
        <svg width="34" height="22" viewBox="0 0 34 22"><g fill="currentColor"><rect x="1" y="1" width="2" height="20"/><rect x="5" y="1" width="1" height="20"/><rect x="8" y="1" width="3" height="20"/><rect x="13" y="1" width="1" height="20"/><rect x="16" y="1" width="2" height="20"/><rect x="20" y="1" width="1" height="20"/><rect x="23" y="1" width="3" height="20"/><rect x="28" y="1" width="1" height="20"/><rect x="31" y="1" width="2" height="20"/></g></svg>
      </span>
      <h2>Placard à portions</h2>
      <p>Mes portions, leurs calories et les codes-barres à scanner dans Yazio.</p>
      <span class="aller">Ouvrir →</span>
    </a>
  </nav>
</main>
</body>
</html>
